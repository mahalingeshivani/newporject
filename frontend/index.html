<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Sales Prediction Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#070b1a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#e8ecff;--mut:#8f9ac4;--acc:#6ea8ff;--acc2:#a78bfa;--good:#34d399;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);
    background:radial-gradient(1200px 600px at 10% -10%,#1b2a6b55,transparent),radial-gradient(900px 500px at 100% 0,#5b2a8a44,transparent),var(--bg);min-height:100vh}
  header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:18px 24px}
  h1{font-size:20px;margin:0;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button,select,label.btn{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
  button:hover,label.btn:hover{border-color:var(--acc)}
  main{padding:0 24px 40px;display:grid;gap:16px;max-width:1300px;margin:auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(8px);
    transform-style:preserve-3d;transition:transform .2s,border-color .2s}
  .kpi:hover{transform:perspective(700px) rotateX(4deg) translateY(-4px);border-color:var(--acc)}
  .kpi small{color:var(--mut)} .kpi b{display:block;font-size:26px;margin-top:6px}
  .up{color:var(--good)} .down{color:var(--bad)}
  .grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  #three{height:420px;position:relative;border-radius:12px;overflow:hidden;cursor:grab}
  #tip{position:absolute;pointer-events:none;background:#000c;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:13px;display:none}
  .chartbox{height:420px;position:relative}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap} .row h3{margin:0;flex:1}
  table{width:100%;border-collapse:collapse;font-size:14px} td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line)} th{color:var(--mut);font-weight:500}
  #msg{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>⚡ AI Sales Prediction Dashboard</h1>
  <div class="btns">
    <button id="retrain">Retrain model</button>
    <label class="btn">Upload CSV<input id="file" type="file" accept=".csv" hidden></label>
  </div>
</header>
<main>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
    <div class="card"><div class="row"><h3>3D Revenue Map (product × region)</h3><small id="msg">drag to rotate · hover bars</small></div>
      <div id="three"><div id="tip"></div></div></div>
    <div class="card"><div class="row"><h3>History & Forecast</h3>
      <select id="product"><option value="">All products</option></select>
      <select id="days"><option>14</option><option selected>30</option><option>60</option><option>90</option></select></div>
      <div class="chartbox"><canvas id="chart"></canvas></div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">Model accuracy (last 60 days hold-out)</h3>
    <table><thead><tr><th>Product</th><th>MAE (units/day)</th><th>R²</th></tr></thead><tbody id="metrics"></tbody></table></div>
</main>

<script>
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n).toLocaleString(undefined,{maximumFractionDigits:0});
const api = async (p, opt) => { const r = await fetch('/api' + p, opt); if(!r.ok) throw new Error(await r.text()); return r.json(); };
const COLORS = {Laptop:0x6ea8ff,Smartphone:0xa78bfa,Headphones:0x34d399,Smartwatch:0xfbbf24};

/* ---------- KPIs ---------- */
async function loadKpis(){
  const s = await api('/summary');
  const cls = s.growth_pct >= 0 ? 'up' : 'down';
  $('#kpis').innerHTML = [
    ['Total revenue', money(s.revenue)],
    ['Units sold', s.units.toLocaleString()],
    ['Last 30 days', `${money(s.last30_revenue)} <span class="${cls}" style="font-size:14px">${s.growth_pct>=0?'▲':'▼'} ${Math.abs(s.growth_pct)}%</span>`],
    ['Forecast next 30 days', money(s.forecast30_revenue)]
  ].map(([a,b]) => `<div class="card kpi"><small>${a}</small><b>${b}</b></div>`).join('');
}

/* ---------- Chart ---------- */
let chart;
async function loadChart(){
  const p = $('#product').value, d = $('#days').value;
  const qs = p ? '&product=' + encodeURIComponent(p) : '';
  const [hist, fc] = await Promise.all([api(`/sales/timeseries?days=90${qs}`), api(`/forecast?days=${d}${qs}`)]);
  const labels = [...hist.map(x=>x.date), ...fc.forecast.map(x=>x.date)];
  const h = [...hist.map(x=>x.units), ...fc.forecast.map(()=>null)];
  const lastH = hist[hist.length-1].units;
  const f = [...hist.map((_,i)=> i===hist.length-1 ? lastH : null), ...fc.forecast.map(x=>x.units)];
  if(chart) chart.destroy();
  chart = new Chart($('#chart'), {type:'line', data:{labels, datasets:[
    {label:'Actual units', data:h, borderColor:'#6ea8ff', backgroundColor:'#6ea8ff22', fill:true, pointRadius:0, tension:.3},
    {label:'Forecast units', data:f, borderColor:'#fbbf24', borderDash:[6,4], pointRadius:0, tension:.3}]},
    options:{maintainAspectRatio:false, interaction:{mode:'index',intersect:false}, animation:{duration:900},
      scales:{x:{ticks:{color:'#8f9ac4',maxTicksLimit:8},grid:{display:false}}, y:{ticks:{color:'#8f9ac4'},grid:{color:'#ffffff14'}}},
      plugins:{legend:{labels:{color:'#e8ecff'}}}}});
}

/* ---------- Metrics ---------- */
async function loadMetrics(){
  const m = await api('/metrics');
  $('#metrics').innerHTML = Object.entries(m).map(([k,v]) => `<tr><td>${k}</td><td>${v.mae}</td><td>${v.r2}</td></tr>`).join('');
}

/* ---------- 3D scene ---------- */
const box = $('#three');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, box.clientWidth/box.clientHeight, .1, 200);
camera.position.set(11, 9, 13); camera.lookAt(0, 2, 0);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(box.clientWidth, box.clientHeight);
box.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, .55));
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(8, 14, 6); scene.add(sun);
const group = new THREE.Group(); scene.add(group);
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshBasicMaterial({color:0x1b2a6b, transparent:true, opacity:.35}));
floor.rotation.x = -Math.PI/2; group.add(floor);
group.add(new THREE.GridHelper(14, 14, 0x3b4a8a, 0x26305a));

// floating particles
const pg = new THREE.BufferGeometry(), pc = 400, pos = new Float32Array(pc*3);
for(let i=0;i<pc*3;i++) pos[i] = (Math.random()-.5)*30;
pg.setAttribute('position', new THREE.BufferAttribute(pos,3));
const stars = new THREE.Points(pg, new THREE.PointsMaterial({color:0x8fb4ff, size:.07})); scene.add(stars);

function label(text){
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = '#e8ecff'; x.font = 'bold 30px system-ui'; x.textAlign = 'center'; x.fillText(text, 128, 42);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true}));
  s.scale.set(3, .75, 1); return s;
}

const bars = [];
async function build3D(){
  const data = await api('/sales/by-product-region');
  const prods = [...new Set(data.map(d=>d.product))], regs = [...new Set(data.map(d=>d.region))];
  const max = Math.max(...data.map(d=>d.revenue));
  const geo = new THREE.BoxGeometry(1.3, 1, 1.3); geo.translate(0, .5, 0);
  data.forEach(d => {
    const i = prods.indexOf(d.product), j = regs.indexOf(d.region);
    const mat = new THREE.MeshStandardMaterial({color: COLORS[d.product] || 0x6ea8ff, metalness:.3, roughness:.35});
    const m = new THREE.Mesh(geo, mat);
    m.position.set((i-(prods.length-1)/2)*2.4, 0, (j-(regs.length-1)/2)*2.4);
    m.userData = {target: Math.max(d.revenue/max*7, .1), info:`${d.product} · ${d.region}<br>${money(d.revenue)} · ${d.units.toLocaleString()} units`};
    m.scale.y = .01; group.add(m); bars.push(m);
  });
  prods.forEach((p,i) => { const s = label(p); s.position.set((i-(prods.length-1)/2)*2.4, -.2, (regs.length/2+.6)*2.4/1.2); group.add(s); });
  regs.forEach((r,j) => { const s = label(r); s.position.set(-(prods.length/2+.4)*2.4/1.1, -.2, (j-(regs.length-1)/2)*2.4); group.add(s); });
}

let rotY = .6, vel = .003, dragging = false, lx = 0, t0 = performance.now();
box.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; box.style.cursor = 'grabbing'; });
addEventListener('pointerup', () => { dragging = false; box.style.cursor = 'grab'; });
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let hovered = null;
box.addEventListener('pointermove', e => {
  if(dragging){ rotY += (e.clientX - lx) * .008; lx = e.clientX; }
  const r = box.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(bars)[0];
  hovered = hit ? hit.object : null;
  const tip = $('#tip');
  if(hovered){ tip.style.display='block'; tip.style.left=(e.clientX-r.left+12)+'px'; tip.style.top=(e.clientY-r.top+12)+'px'; tip.innerHTML=hovered.userData.info; }
  else tip.style.display='none';
});
(function animate(){
  requestAnimationFrame(animate);
  const p = Math.min((performance.now()-t0)/1500, 1), ease = 1 - Math.pow(1-p, 3);
  bars.forEach(b => { const tgt = b.userData.target * ease; b.scale.y += (tgt - b.scale.y) * .2; b.material.emissive.setHex(b === hovered ? 0x222244 : 0); });
  if(!dragging && !hovered) rotY += vel;
  group.rotation.y = rotY; stars.rotation.y += .0007;
  renderer.render(scene, camera);
})();
addEventListener('resize', () => { camera.aspect = box.clientWidth/box.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(box.clientWidth, box.clientHeight); });

/* ---------- Actions ---------- */
$('#product').onchange = loadChart; $('#days').onchange = loadChart;
$('#retrain').onclick = async () => { $('#msg').textContent = 'Training…'; await api('/train', {method:'POST'}); await Promise.all([loadMetrics(), loadChart(), loadKpis()]); $('#msg').textContent = 'Model retrained ✔'; };
$('#file').onchange = async e => {
  const fd = new FormData(); fd.append('file', e.target.files[0]); $('#msg').textContent = 'Uploading & retraining…';
  try { const r = await api('/upload', {method:'POST', body:fd}); $('#msg').textContent = `Inserted ${r.inserted} rows ✔`; location.reload(); }
  catch(err){ $('#msg').textContent = 'Upload failed: ' + err.message.slice(0,80); }
};

(async function init(){
  try {
    const prods = await api('/products');
    $('#product').innerHTML += prods.map(p => `<option>${p}</option>`).join('');
    await Promise.all([loadKpis(), loadChart(), loadMetrics(), build3D()]);
  } catch(e){ $('#msg').textContent = 'Backend starting… refresh in a few seconds'; }
})();
</script>
</body>
</html>
